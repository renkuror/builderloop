[package]
name = "cohort-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "cohort_build"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "builderloop/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
builderloop = { path = "../builderloop", features = ["cpi"] }
